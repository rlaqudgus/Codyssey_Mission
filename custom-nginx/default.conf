server {
    listen 80;
    server_name localhost;

    # 커스텀 포인트: 헬스체크용 엔드포인트 추가
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}